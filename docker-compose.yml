services:
  backend:
    build:
      context: ./backend
    container_name: kapalunch-api
    restart: unless-stopped
    ports:
      - "10011:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/data/database.sqlite
      - CORS_ORIGIN=*
      - JWT_SECRET=change_secret_key_in_production
    volumes:
      - sqlite_data:/data

  frontend:
    build:
      context: ./frontend
    container_name: kapalunch-front
    restart: unless-stopped
    ports:
      - "10081:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
